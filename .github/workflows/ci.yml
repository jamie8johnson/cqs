name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache HF models
        # Tests that warm the embedder (doctor, etc.) download the default
        # model from HuggingFace; repeated CI runs trip HF's 429 rate limit.
        # Bump the key suffix when the default model changes.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-embeddinggemma-300m-v1
      - name: Cache ort prebuilt binaries
        # The ort-sys build script downloads ONNX Runtime prebuilts from
        # cdn.pyke.io, which intermittently rejects the GH-runner IP range
        # (403s / connection resets) and takes every build job with it. The
        # rust-cache key churns with Cargo.lock, so this dedicated cache is
        # keyed on the ort-sys version alone — bump the key when ort bumps.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-prebuilt-2.0.0-rc.12-linux-x64
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache ort prebuilt binaries
        # Shields the ort-sys CDN download; see the test job's twin step.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-prebuilt-2.0.0-rc.12-linux-x64
      - name: Clippy
        # `slow-tests` is a pure cfg gate (no optional deps), so adding it here
        # costs one extra cfg compile of the test crates and closes the
        # structural blind spot where the `#![cfg(feature = "slow-tests")]`
        # corpus was never linted under `-D warnings` (#2154). `mcp-http` rides
        # the (default) `serve` deps — no new crates — and only flips the
        # `#[cfg(feature = "mcp-http")]` listener + its `all(unix, "mcp-http",
        # "slow-tests")` e2e test into the linted set, which would otherwise
        # never see `-D warnings` at PR time.
        run: cargo clippy --all-targets --features slow-tests,mcp-http -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Comment provenance check
        if: github.event_name == 'pull_request'
        # On pull_request, HEAD is the PR merge commit; HEAD^1 is the base tip,
        # so this diff is exactly the PR's net effect.
        run: |
          git diff HEAD^1 HEAD -- '*.rs' \
            | python3 scripts/check_comment_provenance.py
      - name: Daemon request-path cwd check
        # Whole-tree invariant (not diff-based): daemon request handlers must
        # resolve their filesystem target from the served-project root in
        # BatchContext, never from process cwd. Runs on push and PR.
        run: python3 scripts/check_daemon_cwd.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Cache ort prebuilt binaries
        # Shields the ort-sys CDN download; see the test job's twin step.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-prebuilt-2.0.0-rc.12-linux-x64
      - name: Check MSRV
        run: cargo check --verbose

  windows-check:
    # ubuntu-latest is the only build target above, so a sibling-target HARD
    # ERROR — an ungated unix-only API (E0432, the class that broke serve on
    # Windows) or an E0277 unsized-cfg-arm binding (the class that skipped the
    # v1.46.0 release) — is invisible until the release.yml v* tag cross-build.
    # This native windows-latest check catches that hard-error class at PR time,
    # with real type info, closing the actually-costly "release skips a binary"
    # gap before the tag rather than after it.
    #
    # It does NOT set `-D warnings`: Windows carries a large dead_code backlog of
    # daemon-client / MCP-bridge code that is live only via the (unix-only)
    # socket path and becomes live on Windows once the named-pipe transport
    # lands — so enforcing the dead-code-warning shape now would mean annotating
    # ~100 items that then invert. Instead the ledger guard below freezes today's
    # backlog and fails only on a NEW dead_code straggler (a cfg(unix)-gated
    # helper's Windows twin that rotted) or a STALE ledger entry (the backlog
    # shrank) — the warning-shape regression coverage without the annotation
    # churn. The hard-error gate is orthogonal and durable (a hard error is fatal
    # with or without `-D warnings`).
    #
    # Default features (no cuda/tiered) to match release.yml's Windows build and
    # keep the runner buildable; `check` (not clippy/test) to bound runner time.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Windows cargo check (sibling hard-error gate + dead-code ledger)
        shell: bash
        run: |
          # One compile. JSON diagnostics feed BOTH the hard-error gate (a
          # non-zero cargo exit is E0432/E0277) and the dead_code ledger guard.
          # `cargo clean -p cqs` forces the local crate to recompile so its
          # warnings re-emit even on a warm rust-cache (which only caches deps).
          cargo clean -p cqs || true
          # `|| rc=$?` keeps `set -eo pipefail` (GitHub's bash default) from
          # aborting on a hard error, so the guard still runs to render the
          # errors readably and fail the step via --cargo-rc.
          rc=0
          cargo check --message-format=json > cargo-check.json || rc=$?
          python scripts/check_windows_deadcode.py --cargo-rc "$rc" cargo-check.json
      - name: Upload dead-code diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-check-json
          path: cargo-check.json
          if-no-files-found: ignore
